name: Build & Release Drive Logic AI

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests & Damage Algorithm Verification
        run: |
          cd android
          ./gradlew testProdReleaseUnitTest

      - name: Build Release AAB
        env:
          GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.PLAY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          ./gradlew bundleProdRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 14

      - name: Determine Release Track
        id: release_track
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TRACK=production" >> $GITHUB_ENV
          else
            echo "TRACK=internal" >> $GITHUB_ENV
          fi

      - name: Publish to Google Play

        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.DriveLogicAI_chat
          releaseFiles: android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}
          mappingFile: android/app/build/outputs/mapping/prodRelease/mapping.txt
